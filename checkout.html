body { margin:0; background:var(--paper); color:var(--ink);

a { color:inherit; }
.wrap { max-width:1100px; margin:0 auto; padding:0 24px; }

.hero { padding:64px 24px 32px; max-width:1100px; margin:0 auto; }

.lede { font-size:1.15rem; color:var(--muted); max-width:48ch; margin:0 0 1.4em; }
.filters { display:flex; flex-wrap:wrap; gap:10px; margin:24px 0 8px; }

.grid { display:grid; gap:22px; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); margin:28px 0 64px; }
.card { text-decoration:none; display:block; }
.card img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#e8e3d9; }
.card:hover img { opacity:.85; }
.card .t { display:block; margin-top:10px; font-size:.88rem; line-height:1.4; }
.card .p { display:block; margin-top:3px; font-size:.85rem; color:var(--muted); }
.product { display:grid; grid-template-columns:1.15fr 1fr; gap:48px; padding:40px 0 72px; }

.gallery .main { width:100%; display:block; background:#e8e3d9; }
.thumbs { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.thumbs img { width:68px; height:68px; object-fit:cover; cursor:pointer; opacity:.55; background:#e8e3d9; }
.thumbs img[aria-current="true"] { opacity:1; outline:1px solid var(--ink); }
.buy h1 { font-size:1.5rem; line-height:1.3; margin:0 0 12px; }
.price { font-size:1.6rem; margin:0 0 22px; }
.opt { display:block; margin:0 0 8px; font-size:.8rem; letter-spacing:.08em;

.sizes { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
.sizes label { display:flex; justify-content:space-between; gap:12px; cursor:pointer;

.sizes input { display:none; }
.sizes label:has(input:checked) { border-color:var(--ink); background:rgba(0,0,0,.03); }
.sizes .amt { color:var(--muted); }
.btn { display:block; width:100%; text-align:center; background:var(--ink); color:var(--paper);
  border:none; font:inherit; padding:15px 28px; letter-spacing:.04em; cursor:pointer; text-decoration:none; }
.btn:hover { background:var(--accent); }
.note { font-size:.85rem; color:var(--muted); margin-top:14px; }
.desc { white-space:pre-wrap; font-size:.95rem; line-height:1.7; margin-top:34px;

footer { border-top:1px solid var(--line); margin-top:48px; padding:32px 24px;
